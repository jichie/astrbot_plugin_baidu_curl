name: astrbot_plugin_baidu_curl
display_name: 百度网盘直链下载助手
desc: 发送百度网盘分享链接，自动转存、提取直链并生成cURL下载命令。支持推送到 Motrix 下载器（携带 UA + BDUSS Cookie 实现会员不限速）。内置转存（BDUSS Cookie）、OpenList集成、文件自动整理、多文件选择。
help: |
  使用方法：
  1. 配置百度网盘 Cookie（baidu_cookies）
     获取方式：浏览器登录 pan.baidu.com → F12 → Network → 刷新页面
     → 点击任意请求 → Headers → Cookie 复制全部内容
     插件会自动提取 BDUSS 和 STOKEN
  2. 配置 OpenList 地址和账号（用于获取百度直链）
  3. 发送百度网盘分享链接，如：
     https://pan.baidu.com/s/1xxxxxxx 提取码:xxxx
  4. 插件会自动转存、提取直链、整理文件并返回cURL下载命令

  多文件选择（需开启 enable_file_selection）：
  - 转存后如有多个文件，插件会列出编号列表
  - 回复数字选择文件（如 1 或 1 3）
  - 回复 0 或 all 选择全部
  - 120秒内有效，发送新链接可取消选择

  推送到下载器（Motrix）：
  - push_mode 三种模式：
    · link_only：只提取直链（原行为）
    · push_only：提取直链后自动推送到下载器
    · link_and_push：显示直链后再询问是否推送（回复 y 推送 / n 跳过，60秒内有效）
  - push_whitelist：推送白名单（群号/用户ID），与 allow_sessions 独立，留空禁止推送
  - Motrix：配置 motrix_rpc_url（如 http://127.0.0.1:16800/jsonrpc）及可选 motrix_rpc_token，
    并在 Motrix 设置中开启 RPC 服务
  - 推送时自动携带 User-Agent（pan.baidu.com，与已验证不限速的 cURL 命令一致）
    和 BDUSS Cookie，下载器请求直链时同样不限速，效果等同终端 cURL 下载

  前置依赖：
  - 百度网盘 Cookie（BDUSS + STOKEN）
  - OpenList/AList：用于获取百度网盘 access_token
